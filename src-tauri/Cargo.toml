[package]
name = "afterhours-launcher"
version = "0.5.0"
description = "Graphical launcher for the Afterhours 2015 local server and game"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false

# Standalone, also when the checkout sits inside another Cargo workspace.
[workspace]

[lib]
name = "afterhours_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# build.rs reads ../server-pin.json and checks the bundled server's SHA-256
# with the same `pin` module the app uses (src/pin.rs).
[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
# MIT; already used by tauri-plugin-dialog. Native startup errors work even
# when the webview cannot be created. No new runtime package/version.
rfd = { version = "=0.16.0", default-features = false, features = ["common-controls-v6"] }

[dependencies]
# MIT; cross-platform Discord presence. Calls run in this executable's helper mode.
discord-presence = "=3.2.0"
# MIT; bounded helper supervision. Reuses the locked Tokio version.
tokio = { version = "=1.53.3", features = ["io-util", "process", "sync", "time", "rt", "macros"] }
# The token the launcher gives its own server's API (MIT or Apache-2.0).
getrandom = "=0.2.17"
tauri = { version = "=2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
