[package]
name = "afterhours-launcher"
version = "0.1.0"
description = "Graphical launcher for the Afterhours 2015 local server and game"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false

[lib]
name = "afterhours_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
