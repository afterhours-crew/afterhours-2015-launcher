name: Server pin bump

# Hourly, or by hand: if afterhours-crew/afterhours-2015 has published a
# release newer than server-pin.json, open the release pull request that moves
# the pin, takes the schemas attached to that release, regenerates
# src/lib/api/generated and sets the next launcher version (the patch, or the
# minor when launcher changes are waiting; RELEASING.md). Its description
# holds the draft notes. CI on that branch runs the new Afterhours.exe's JSON
# commands against the schemas. A person reviews and merges; merging tags the
# release (release-tag.yml), and nothing here merges or publishes.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Check for a newer server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The release notes cover the history since the previous tag.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Latest server release
        id: latest
        run: node scripts/server-pin.mjs latest

      - name: Pull request already open?
        id: branch
        if: steps.latest.outputs.tag != ''
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          branch="pin/afterhours-$TAG"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$branch already exists; review its pull request."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the pin, regenerate the types and set the version
        id: prepare
        if: steps.latest.outputs.tag != '' && steps.branch.outputs.exists == 'false'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          node scripts/server-pin.mjs bump "$TAG" --summary "$RUNNER_TEMP/pin.md"
          pnpm types
          pnpm exec prettier --write server-pin.json schemas src/lib/api/generated
          node scripts/release/cli.mjs prepare --for-pin --pin-summary "$RUNNER_TEMP/pin.md" --body "$RUNNER_TEMP/pr-body.md"
          node scripts/versions.mjs
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      # Pull requests opened with GITHUB_TOKEN start no pull_request runs, so
      # CI is dispatched on the branch; its checks count for the merge.
      - name: Open the pull request and run CI on it
        if: steps.latest.outputs.tag != '' && steps.branch.outputs.exists == 'false'
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          TITLE: ${{ steps.prepare.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add server-pin.json schemas src/lib/api/generated \
            package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          gh workflow run ci.yml --ref "$BRANCH"
