name: Release

# A `v*` tag builds the signed-for-updates NSIS installer and attaches it,
# its .sig and latest.json to a draft release, with the notes reviewed in the
# release pull request that merged the tagged commit. Tag release
# (release-tag.yml) dispatches this for the tags it creates, since a tag
# pushed with GITHUB_TOKEN starts no workflow. The owner tests the draft and
# publishes it; only then does the updater endpoint
# (releases/latest/download/latest.json) offer it. See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build the draft for, such as v0.3.0"
        required: true
        type: string

permissions:
  contents: write
  # Reads the release pull request's notes.
  pull-requests: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag matches every version field
        run: node scripts/versions.mjs --tag "$TAG"

      - name: The updater signing key is set up
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e 'const c = require("./src-tauri/tauri.conf.json"); if (!c.plugins.updater.pubkey.trim()) { console.error("plugins.updater.pubkey is empty; see RELEASING.md."); process.exit(1); }'
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "The TAURI_SIGNING_PRIVATE_KEY secret is missing; see RELEASING.md."
            exit 1
          fi

      - name: Pinned server
        id: pin
        run: |
          pnpm sidecar
          pnpm contract
          echo "tag=$(node -p 'require("./server-pin.json").tag')" >> "$GITHUB_OUTPUT"

      - run: pnpm test

      - name: Release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/cli.mjs notes --commit "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/notes.md"
          delimiter="NOTES_$(node -p 'require("crypto").randomBytes(16).toString("hex")')"
          { echo "body<<$delimiter"; cat "$RUNNER_TEMP/notes.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and attach to a draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Afterhours Launcher __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Attach the no-install ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(node scripts/portable-zip.mjs --exe src-tauri/target/release/afterhours-launcher.exe --out "$RUNNER_TEMP/portable" | tail -n 1)
          gh release upload "$TAG" "$zip" --clobber

      - name: Name the bundled server in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/manifest"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/manifest" --clobber
          node scripts/updater-manifest.mjs "$RUNNER_TEMP/manifest/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/manifest/latest.json" --clobber
