name: CI

on:
  push:
    branches: [main, "feature/**", "bugfix/**", "docs/**", "codex/**"]
  # On a release pull request (opened with GITHUB_TOKEN) this run waits for a
  # person's approval; see RELEASING.md.
  pull_request:
  # By hand, on any branch. A dispatched run's checks do not count for a pull
  # request, so it cannot stand in for the pull_request run.
  workflow_dispatch:

permissions:
  contents: read

# Every main commit keeps its own run: a merged release is tagged only after
# CI passes on its merge commit (release-tag.yml), so none may be cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm versions
      - name: Generated files are current
        run: |
          pnpm tokens
          pnpm types
          git diff --exit-code -- src/lib/styles/tokens.css src/lib/api/generated
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build.rs refuses a Windows build without the pinned, verified server.
      - name: Bundled server
        if: runner.os == 'Windows'
        run: pnpm sidecar
      # The Tauri context macro embeds the built frontend, so build it first.
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Compile the app without bundling
        run: pnpm tauri build --no-bundle

  contract:
    name: Server contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download and verify the pinned Afterhours.exe
        run: pnpm sidecar
      - name: Run its JSON commands against temporary data folders
        run: pnpm contract

  bundle:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sidecar
      # No updater artifacts: those need the signing key, which only the
      # release workflow has. Neither is Authenticode-signed.
      - name: Build the NSIS installer
        run: pnpm bundle --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: afterhours-launcher-setup-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      # The same build as the no-install ZIP the release attaches.
      - name: Build the no-install ZIP
        run: node scripts/portable-zip.mjs --exe src-tauri/target/release/afterhours-launcher.exe --out "${{ runner.temp }}/portable"
      - uses: actions/upload-artifact@v4
        with:
          name: afterhours-launcher-portable-unsigned
          path: ${{ runner.temp }}/portable/*.zip
          if-no-files-found: error
          retention-days: 14

  # What the next release would start with, from the base branch: version
  # and notes in the run summary. Nothing is committed or pushed.
  release-preview:
    name: Release preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Draft the next release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          node scripts/release/cli.mjs prepare --head HEAD^1 --preview --body "$RUNNER_TEMP/pr-body.md" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "Nothing to release on the base branch yet." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
