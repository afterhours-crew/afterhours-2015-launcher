name: CI

on:
  push:
    branches: [main, "feature/**", "bugfix/**", "docs/**", "codex/**"]
  # On a release pull request (opened with GITHUB_TOKEN) this run waits for a
  # person's approval; see RELEASING.md.
  pull_request:
  # By hand, on any branch. A dispatched run's checks do not count for a pull
  # request, so it cannot stand in for the pull_request run.
  workflow_dispatch:
    inputs:
      preview_server_revision:
        description: "Optional full afterhours-2015 commit: build an isolated prologue preview"
        required: false
        type: string

permissions:
  contents: read

# Every main commit keeps its own run: a merged release is tagged only after
# CI passes on its merge commit (release-tag.yml), so none may be cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm versions
      - name: Generated files are current
        run: |
          pnpm tokens
          pnpm types
          git diff --exit-code -- src/lib/styles/tokens.css src/lib/api/generated
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build.rs refuses a Windows build without the pinned, verified server.
      - name: Bundled server
        if: runner.os == 'Windows'
        run: pnpm sidecar
      # The Tauri context macro embeds the built frontend, so build it first.
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Compile the app without bundling
        run: pnpm tauri build --no-bundle

  contract:
    name: Server contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download and verify the pinned Afterhours.exe
        run: pnpm sidecar
      - name: Run its JSON commands against temporary data folders
        run: pnpm contract

  bundle:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sidecar
      # No updater artifacts: those need the signing key, which only the
      # release workflow has. Neither is Authenticode-signed.
      - name: Build the NSIS installer
        run: pnpm bundle --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: afterhours-launcher-setup-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      # The same build as the no-install ZIP the release attaches.
      - name: Build the no-install ZIP
        run: node scripts/portable-zip.mjs --exe src-tauri/target/release/Afterhours2015Launcher.exe --out "${{ runner.temp }}/portable"
      - name: Migrate the published legacy installation on the disposable runner
        shell: pwsh
        run: ./scripts/Test-InstallerMigration.ps1 -InstallerDirectory src-tauri/target/release/bundle/nsis -OutputDirectory "${{ runner.temp }}/installer-migration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterhours-installer-migration
          path: ${{ runner.temp }}/installer-migration/migration-check.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: afterhours-launcher-portable-unsigned
          path: ${{ runner.temp }}/portable/*.zip
          if-no-files-found: error
          retention-days: 14

  prologue-preview:
    name: Prologue preview package and startup
    if: github.event_name == 'workflow_dispatch' && inputs.preview_server_revision != ''
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Require an immutable canonical server revision
        shell: pwsh
        env:
          SERVER_REVISION: ${{ inputs.preview_server_revision }}
        run: |
          if ($env:SERVER_REVISION -cnotmatch '^[0-9a-f]{40}$') {
            throw 'preview_server_revision must be a full lowercase commit SHA.'
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: afterhours-crew/afterhours-2015
          ref: ${{ inputs.preview_server_revision }}
          path: .preview-server
          persist-credentials: false
      - name: Install pinned toolchains
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location .preview-server
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
          Pop-Location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .preview-server
            src-tauri
          key: prologue-preview
          cache-on-failure: true
      - name: Build and package the canonical server
        working-directory: .preview-server
        shell: pwsh
        env:
          AFTERHOURS_RELEASE: preview-${{ github.run_id }}-${{ github.run_attempt }}
          AFTERHOURS_REVISION: ${{ inputs.preview_server_revision }}
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:AFTERHOURS_REVISION) { throw 'Server checkout mismatch.' }
          cargo build --release --target x86_64-pc-windows-msvc -p nfs-afterhours-bundle --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Package-TerminalBundle.ps1 -Executable target/x86_64-pc-windows-msvc/release/Afterhours.exe -OutputDirectory "$env:RUNNER_TEMP/preview-server" -Release $env:AFTERHOURS_RELEASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep the ordinary build-time pin verification intact. The explicit
      # preview config selects the separately verified candidate for bundling.
      - run: pnpm sidecar
      - name: Check the candidate contract and prepare the isolated distribution
        run: node scripts/preview-package.mjs --server-package "${{ runner.temp }}/preview-server/package" --out "${{ runner.temp }}/preview-input"
      - name: Build the preview installer without running it
        run: pnpm tauri build --bundles nsis --config "${{ runner.temp }}/preview-input/tauri-preview.json" --ci
      - name: Build the matching preview ZIP
        run: node scripts/portable-zip.mjs --exe src-tauri/target/release/Afterhours2015Launcher.exe --out "${{ runner.temp }}/preview-portable" --preview-input "${{ runner.temp }}/preview-input"
      - name: Install and check first-run startup on the disposable runner
        shell: powershell
        run: |
          ./scripts/Test-PreviewProcess.ps1
          ./scripts/Test-PreviewStartup.ps1 -InstallerDirectory src-tauri/target/release/bundle/nsis -PortableDirectory "${{ runner.temp }}/preview-portable" -PreviewInput "${{ runner.temp }}/preview-input" -OutputDirectory "${{ runner.temp }}/preview-startup"
      # Preserve failed startup evidence too. A downloadable artifact alone
      # does not mean the startup check or the other CI gates passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afterhours-prologue-preview
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/preview-portable/*.zip
            ${{ runner.temp }}/preview-portable/preview-build.json
            ${{ runner.temp }}/preview-startup/
          if-no-files-found: error
          retention-days: 14

  # What the next release would start with, from the base branch: version
  # and notes in the run summary. Nothing is committed or pushed.
  release-preview:
    name: Release preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Draft the next release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          node scripts/release/cli.mjs prepare --head HEAD^1 --preview --body "$RUNNER_TEMP/pr-body.md" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "Nothing to release on the base branch yet." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
